# Production Docker Compose Configuration with HTTPS
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # API Gateway with HTTPS
  api-gateway:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SSL_KEYSTORE_PATH: /app/ssl/keystore.p12
      SSL_KEYSTORE_PASSWORD: ${SSL_KEYSTORE_PASSWORD:-changeit}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}  # 1 hour
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://cloudforgetech.in,https://www.cloudforgetech.in}
    ports:
      - "8443:8443"  # HTTPS port
      - "8080:8080"  # HTTP port (for redirect)
    volumes:
      - ../ssl/api-gateway/keystore.p12:/app/ssl/keystore.p12:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:8443/actuator/health"]

  # Frontend with HTTPS
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${API_GATEWAY_URL:-https://api.cloudforgetech.in}
    ports:
      - "443:443"   # HTTPS port
      - "80:80"     # HTTP port (for redirect)
    volumes:
      - ../ssl/frontend/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - ../ssl/frontend/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - ../ssl/frontend/chain.pem:/etc/nginx/ssl/chain.pem:ro
      - ../../frontend/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:443/health"]

  # User Service - Production logging
  user-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOGGING_LEVEL_IO_CLOUDFORGE: INFO

  # Product Service - Production logging
  product-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOGGING_LEVEL_IO_CLOUDFORGE: INFO

  # Order Service - Production logging
  order-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOGGING_LEVEL_IO_CLOUDFORGE: INFO

  # Payment Service - Production logging
  payment-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOGGING_LEVEL_IO_CLOUDFORGE: INFO

  # Notification Service - Production logging
  notification-service:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LOGGING_LEVEL_IO_CLOUDFORGE: INFO
