<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular badge background with gradient -->
  <defs>
    <linearGradient id="iconBadgeGradient" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8A05D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="iconCloudGradient" x1="32" y1="18" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#CC6600"/>
    </linearGradient>
  </defs>
  
  <!-- Circular badge -->
  <circle cx="32" cy="32" r="30" fill="url(#iconBadgeGradient)" stroke="#E8A05D" stroke-width="2"/>
  
  <!-- Cloud with interconnected nodes -->
  <g transform="translate(32, 28)">
    <!-- Cloud outline -->
    <path d="M-10,-8 C-12,-10 -14,-10 -16,-8 C-16,-6 -14,-4 -12,-4 L12,-4 C14,-4 16,-6 16,-8 C16,-10 14,-10 12,-8 C10,-10 8,-10 6,-8 C4,-10 2,-10 0,-8 C-2,-10 -4,-10 -6,-8 C-8,-10 -10,-10 -10,-8 Z" 
          fill="url(#iconCloudGradient)" opacity="0.9"/>
    
    <!-- Interconnected nodes -->
    <circle cx="-8" cy="-2" r="3" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1.5"/>
    <circle cx="0" cy="-5" r="3" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1.5"/>
    <circle cx="8" cy="-2" r="3" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1.5"/>
    <circle cx="-4" cy="3" r="3" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1.5"/>
    <circle cx="4" cy="3" r="3" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1.5"/>
    
    <!-- Connection lines -->
    <line x1="-8" y1="-2" x2="0" y2="-5" stroke="#E8A05D" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-5" x2="8" y2="-2" stroke="#E8A05D" stroke-width="1.5" opacity="0.6"/>
    <line x1="-8" y1="-2" x2="-4" y2="3" stroke="#E8A05D" stroke-width="1.5" opacity="0.6"/>
    <line x1="8" y1="-2" x2="4" y2="3" stroke="#E8A05D" stroke-width="1.5" opacity="0.6"/>
    <line x1="-4" y1="3" x2="4" y2="3" stroke="#E8A05D" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- CloudForge text -->
  <text x="32" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#E8A05D" text-anchor="middle">CloudForge</text>
</svg>
