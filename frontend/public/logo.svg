<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular badge background with gradient -->
  <defs>
    <linearGradient id="badgeGradient" x1="30" y1="0" x2="30" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8A05D"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="cloudGradient" x1="30" y1="15" x2="30" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9933"/>
      <stop offset="100%" stop-color="#CC6600"/>
    </linearGradient>
  </defs>
  
  <!-- Circular badge -->
  <circle cx="30" cy="30" r="28" fill="url(#badgeGradient)" stroke="#E8A05D" stroke-width="2"/>
  
  <!-- Cloud with interconnected nodes (representing microservices) -->
  <g transform="translate(30, 30)">
    <!-- Cloud outline -->
    <path d="M-8,-8 C-10,-10 -12,-10 -14,-8 C-14,-6 -12,-4 -10,-4 L10,-4 C12,-4 14,-6 14,-8 C14,-10 12,-10 10,-8 C8,-10 6,-10 4,-8 C2,-10 0,-10 -2,-8 C-4,-10 -6,-10 -8,-8 Z" 
          fill="url(#cloudGradient)" opacity="0.9"/>
    
    <!-- Interconnected nodes (microservices pattern) -->
    <circle cx="-6" cy="-2" r="2.5" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1"/>
    <circle cx="0" cy="-4" r="2.5" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1"/>
    <circle cx="6" cy="-2" r="2.5" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1"/>
    <circle cx="-3" cy="2" r="2.5" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1"/>
    <circle cx="3" cy="2" r="2.5" fill="#4A4A4A" stroke="#E8A05D" stroke-width="1"/>
    
    <!-- Connection lines -->
    <line x1="-6" y1="-2" x2="0" y2="-4" stroke="#E8A05D" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-4" x2="6" y2="-2" stroke="#E8A05D" stroke-width="1" opacity="0.6"/>
    <line x1="-6" y1="-2" x2="-3" y2="2" stroke="#E8A05D" stroke-width="1" opacity="0.6"/>
    <line x1="6" y1="-2" x2="3" y2="2" stroke="#E8A05D" stroke-width="1" opacity="0.6"/>
    <line x1="-3" y1="2" x2="3" y2="2" stroke="#E8A05D" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- CloudForge text below the badge -->
  <text x="30" y="50" font-family="Arial, sans-serif" font-size="9" font-weight="600" fill="#E8A05D" text-anchor="middle">CloudForge</text>
  
  <!-- CloudForge text on the right -->
  <text x="70" y="38" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FF9933">CloudForge</text>
</svg>
